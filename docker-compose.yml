services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://app:3000 --no-autoupdate
